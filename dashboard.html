<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        :root { 
            --bg-color: #121212; 
            --surface-color: rgba(30, 30, 30, 0.8); 
            --primary-color: #3b82f6; 
            --text-color: #ffffff; 
            --text-secondary-color: #a0a0a0; 
            --shadow-color: rgba(0, 0, 0, 0.5); 
            --delete-color: #e74c3c;
            --success-color: #2ecc71; /* Green for "TODAY!" */
        }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            transition: background-image 0.5s ease-in-out, background-color 0.5s ease-in-out;
        }

        .dashboard-wrapper { padding: 20px; }
        .main-content { 
            display: flex; 
            flex-direction: column; /* Stack Weather on top of Countdowns */
            gap: 30px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* Make both sections full width */
        .weather-column, .countdown-column {
            width: 100%;
            flex: 0 0 auto;
        }

        /* Reset specific landscape/portrait overrides since we want this stack for both */
        .layout-landscape .main-content, 
        .layout-portrait .main-content { 
            flex-direction: column; 
        }
        .layout-landscape .weather-column, .layout-landscape .countdown-column,
        .layout-portrait .weather-column, .layout-portrait .countdown-column {
            flex: 1;
            width: 100%;
            min-width: 0;
        }

        .weather-column { display: flex; flex-direction: column; gap: 15px; text-align: center; }
        
        .date-header { margin-bottom: 5px; text-shadow: 1px 1px 3px var(--shadow-color); }
        
        .clock-header {
            font-size: 9em;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: -15px;
            line-height: 1.1;
            text-shadow: 1px 1px 3px var(--shadow-color);
        }

        .clock-ampm {
            font-size: 0.3em; /* 30% of the 6.5em clock size */
            font-weight: 400;
            vertical-align: super;
            margin-left: 10px;
            color: var(--text-secondary-color);
        }

        .date-numeric {
            font-size: 1.75em;
            font-weight: 500;
            color: var(--text-color);
        }
        .date-weekday {
            font-size: 1.1em;
            vertical-align: super;
            margin-left: 8px;
            color: var(--text-secondary-color);
        }
        
        .weather-column h2 {
            font-size: 1.8em;
            margin: 0;
            text-shadow: 1px 1px 3px var(--shadow-color);
        }

        /* 3-Day Forecast Grid */
        .forecast-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            margin-top: 5px;
        }
        .forecast-card {
            background-color: var(--surface-color);
            border-radius: 12px;
            padding: 15px 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px var(--shadow-color);
            text-align: center;
        }
        .forecast-day {
            font-size: 1.1em;
            font-weight: 600;
        }
        .forecast-card img {
            width: 50px;
            height: 50px;
            margin: 5px 0;
        }
        .forecast-temps {
            font-size: 1.2em;
        }
        .forecast-high {
            font-weight: 600;
            color: var(--text-color);
        }
        .forecast-low {
            color: var(--text-secondary-color);
            margin-left: 5px;
        }
        .forecast-precip {
            font-size: 0.9em;
            color: var(--text-secondary-color);
            margin-top: 5px;
        }

        .countdown-column { flex: 1; min-width: 300px; margin-top: 20px; }
        .grid-container { display: grid; grid-template-columns: 1fr; gap: 15px; }

        .countdown-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: var(--surface-color);
            padding: 15px 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px var(--shadow-color);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .countdown-container:hover { transform: scale(1.02); box-shadow: 0 6px 20px var(--shadow-color); }
        .countdown-container h2 { font-size: 1.5em; margin: 0; text-shadow: 1px 1px 3px var(--shadow-color); }
        .timer { display: flex; align-items: baseline; gap: 10px; text-align: right; }
        .time-value { font-size: 2.5em; font-weight: 600; line-height: 1; color: var(--primary-color); text-shadow: 1px 1px 3px var(--shadow-color); }
        .time-label { font-size: 1.1em; color: var(--text-secondary-color); }
        .time-value.past-event { color: var(--delete-color); }
        .time-value.today {
            color: var(--success-color);
            font-size: 2.2em;
            font-weight: 700;
        }

        /* Styles for Calendar Section */
        .column-title {
            font-size: 1.8em;
            margin: 0;
            text-shadow: 1px 1px 3px var(--shadow-color);
            text-align: center;
        }
        .countdown-column h2 {
            font-size: 1.5em;
        }
        .calendar-event h2 {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 5px;
        }
        .calendar-time {
            font-size: 0.9em;
            font-weight: 700;
            color: var(--primary-color);
        }
        .no-events {
            font-size: 1.1em;
            font-style: italic;
            color: var(--text-secondary-color);
            width: 100%;
            text-align: center;
        }

        /* NEW: Wrapper for the side-by-side events */
        .events-row {
            display: flex;
            gap: 30px;
            width: 100%;
        }
        
        /* NEW: Columns that split the space 50/50 */
        .half-column {
            flex: 1;
            min-width: 0; /* Prevents flexbox overflow issues */
            display: flex;
            flex-direction: column;
            gap: 15px; /* Space between header and grid */
        }

        .settings-icon { position: fixed; top: 20px; right: 20px; width: 40px; height: 40px; cursor: pointer; z-index: 101; }
        .settings-icon svg { width: 100%; height: 100%; filter: drop-shadow(1px 1px 2px var(--shadow-color)); }

        .add-container { display: flex; justify-content: center; align-items: center; background-color: var(--surface-color); border-radius: 50%; color: var(--text-secondary-color); cursor: pointer; width: 60px; height: 60px; margin: 20px auto 0; transition: all 0.2s ease-in-out; border: 1px solid rgba(255, 255, 255, 0.1); }
        .add-container:hover { background-color: var(--primary-color); color: var(--text-color); transform: scale(1.1); }
        .plus-sign { font-size: 3em; font-weight: 200; line-height: 1; user-select: none; }
        
        [x-cloak] { display: none !important; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); display: flex; justify-content: center; align-items: center; z-index: 100; backdrop-filter: blur(5px); }
        .modal-content { background: var(--surface-color); padding: 30px; border-radius: 15px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 20px; border: 1px solid rgba(255, 255, 255, 0.1); }
        
        .modal-content input[type="text"] { background: #333; border: 1px solid #444; border-radius: 8px; color: var(--text-color); font-size: 1em; padding: 12px; }
        .date-input-wrapper { position: relative; }
        .date-input-wrapper::before { content: "---- / -- / --"; position: absolute; left: 12px; top: 12px; color: #777; pointer-events: none; }
        .date-input-wrapper input[type="date"]:valid::before { display: none; }
        input[type="date"] { background: #333; border: 1px solid #444; border-radius: 8px; color: var(--text-color); font-size: 1em; padding: 11px; font-family: inherit; }
        input[type="date"]:invalid { color: transparent; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; transform: scale(1.4); }
        
        .modal-buttons { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; }
        .modal-buttons .right-buttons { display: flex; gap: 10px; }
        .btn-primary, .btn-secondary, .btn-delete { border: none; border-radius: 8px; padding: 10px 20px; font-size: 1em; cursor: pointer; }
        .btn-primary { background-color: var(--primary-color); color: white; }
        .btn-secondary { background-color: #444; color: white; }
        .btn-delete { background-color: var(--delete-color); color: white; }

        .settings-section { width: 100%; margin-bottom: 10px; }
        .settings-section h3 { margin: 0 0 10px 0; font-size: 1.2em; font-weight: 500; }
        .layout-buttons-container { display: flex; gap: 10px; }
        .layout-buttons-container button { flex: 1; background-color: #444; color: white; border: 2px solid #444; border-radius: 8px; padding: 10px 20px; font-size: 1em; cursor: pointer; transition: all 0.2s; }
        .layout-buttons-container button.active { background-color: var(--primary-color); border-color: var(--primary-color); }

        .background-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
        .bg-thumbnail { width: 100%; padding-bottom: 56.25%; background-size: cover; background-position: center; border-radius: 8px; cursor: pointer; border: 2px solid transparent; transition: border-color 0.2s; position: relative; }
        .bg-thumbnail.active { border-color: var(--primary-color); }

        .calendar-time.all-day {
            color: var(--text-secondary-color); /* Make "All Day" text less prominent */
            font-weight: 500;
        }

        /* NEW: Styles for NWS Weather Cards with Graphs */
        /* NEW: Horizontal 3-column Grid for Weather */
        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* 3 equal columns side-by-side */
            gap: 15px;
            margin-top: 10px;
        }
        
        .forecast-card {
            background-color: var(--surface-color);
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px var(--shadow-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between; /* Spreads content out to look like a square */
            gap: 10px;
            min-height: 180px; /* Enforce a bit of height to make it square-ish */
        }
        .forecast-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        .forecast-day {
            font-size: 1.4em;
            font-weight: 600;
        }
        .forecast-summary {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .forecast-summary img {
            width: 40px;
            height: 40px;
        }
        .forecast-temps {
            font-size: 1.2em;
            font-weight: 500;
        }
        .chart-container {
            position: relative;
            height: 100px; /* Fixed height for the graph */
            width: 100%;
        }
    </style>
</head>

<body x-data="countdownApp" :class="'layout-' + layoutMode">
    
    <div class="dashboard-wrapper" :class="'layout-' + layoutMode">
        
        <div class="settings-icon" @click="showSettingsModal = true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.07-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.44,0.17-0.48,0.41L9.22,5.59C8.63,5.83,8.1,6.14,7.61,6.52L5.22,5.56C5,5.49,4.75,5.56,4.63,5.78L2.71,9.1 c-0.12,0.2-0.07,0.47,0.12,0.61L4.86,11c-0.04,0.3-0.06,0.6-0.06,0.94c0,0.32,0.02,0.64,0.07,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.38,2.78 c0.04,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.44-0.17,0.48-0.41l0.38-2.78c0.59-0.24,1.12-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32C21.41,15.03,21.35,14.76,21.14,14.62L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"></path></svg>
        </div>

        <div class="main-content">
            
            <div class="weather-column">
                
                <div class="date-header">
                    <div class="clock-header">
                        <span x-text="currentTime_HM"></span><span class="clock-ampm" x-text="currentTime_AP"></span>
                    </div>
                    <span class="date-numeric" x-text="currentDate.date"></span>
                    <span class="date-weekday" x-text="currentDate.day"></span>
                </div>
                <h2>Southington, CT</h2>
                
                <div class="forecast-grid">
                    <template x-for="(day, index) in forecast" :key="index">
                        <div class="forecast-card">
                            <div class="forecast-header">
                                <div class="forecast-day" x-text="day.name"></div>
                                <div class="forecast-summary">
                                    <img :src="day.icon" :alt="day.shortForecast">
                                    <div class="forecast-temps">
                                        <span style="color: #ff7e5f;" x-text="day.high + '°'"></span> / 
                                        <span style="color: #a1c4fd;" x-text="day.low + '°'"></span>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="chart-container">
                                <canvas :id="'chart-' + index"></canvas>
                            </div>
                        </div>
                    </template>
                </div>

            </div>

            <div class="events-row">
                
                <div class="half-column">
                    <div x-show="!calendarLoading" x-cloak>
                        <h3 class="column-title">Google Calendar Today</h3>
                        <div class="grid-container" id="calendarGrid">
                            <template x-for="(event, index) in calendarEvents" :key="index">
                                <div class="countdown-container calendar-event">
                                    <h2>
                                        <span class="calendar-time" :class="{ 'all-day': event.time === 'All Day' }" x-text="event.time"></span>
                                        <span x-text="event.title"></span>
                                    </h2>
                                </div>
                            </template>
                            <div class="countdown-container calendar-event" x-show="calendarEvents.length === 0">
                                <h2 class="no-events">No events today.</h2>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="half-column">
                    <h3 class="column-title">Event Countdowns</h3>
                    <div class="grid-container" id="countdownGrid">
                        <template x-for="event in events" :key="event.id">
                            <div class="countdown-container" @click="openEditModal(event)">
                                <h2 x-text="event.title"></h2>
                                <div class="timer">
                                    <span x-show="event.isToday" class="time-value today">TODAY!</span>
                                    <span x-show="event.isTomorrow" class="time-value" style="font-size: 2.2em; font-weight: 700;">Tomorrow</span>
                                    <span x-show="event.isYesterday" class="time-value past-event" style="font-size: 2.2em; font-weight: 700;">Yesterday</span>
                                    
                                    <span x-show="!event.isToday && !event.isTomorrow && !event.isYesterday" x-text="event.days" class="time-value" :class="{ 'past-event': event.isPast }">0</span>
                                    <span x-show="!event.isToday && !event.isTomorrow && !event.isYesterday" class="time-label" x-text="event.isPast ? 'Days Ago' : 'Days'">Days</span>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="add-container" @click="openAddModal()">
                        <div class="plus-sign">+</div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <div class="modal-overlay" x-show="showModal" x-cloak @click.self="closeModal()">
        <div class="modal-content">
            <h3 x-text="editingEvent ? 'Edit Countdown' : 'Add New Countdown'"></h3>
            <input type="text" x-model="modalTitle" placeholder="Event Title">
            <div class="date-input-wrapper">
                <input type="date" x-model="modalDate" required onkeydown="return false;">
            </div>
            <div class="modal-buttons">
                <button class="btn-delete" x-show="editingEvent" @click="deleteEvent()">Delete</button>
                <div class="right-buttons">
                    <button class="btn-secondary" @click="closeModal()">Cancel</button>
                    <button class="btn-primary" @click="saveEvent()">Save</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal-overlay" x-show="showSettingsModal" x-cloak @click.self="showSettingsModal = false">
        <div class="modal-content">
            
            <div class="settings-section">
                <h3>Layout</h3>
                <div class="layout-buttons-container">
                    <button :class="{ 'active': layoutMode === 'landscape' }" @click="setLayoutMode('landscape')">Landscape</button>
                    <button :class="{ 'active': layoutMode === 'portrait' }" @click="setLayoutMode('portrait')">Portrait</button>
                </div>
            </div>

            <div class="settings-section">
                <h3>Background</h3>
                <div class="background-grid">
                    <template x-for="bg in backgroundOptions" :key="bg.id">
                        <div class="bg-thumbnail" 
                             :style="bg.thumbnail"
                             :class="{ 'active': JSON.stringify(selectedBackground) === JSON.stringify(bg.value) }"
                             @click="setBackground(bg.value, bg.type)">
                        </div>
                    </template>
                </div>
            </div>

            <div class="modal-buttons">
                <button class="btn-primary" @click="showSettingsModal = false">Done</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('alpine:init', () => {
            Alpine.data('countdownApp', () => ({
                events: [],
                showModal: false,
                editingEvent: null,
                modalTitle: '',
                modalDate: '',
                showSettingsModal: false,
                selectedBackground: null,
                selectedBackgroundType: '',
                layoutMode: 'landscape',

                // Calendar properties
                calendarScriptUrl: 'https://script.google.com/macros/s/YOUR_DEPLOYMENT_ID/exec',
                calendarEvents: [],
                calendarLoading: true,

                forecast: [],
                chartInstances: [],
                
                currentDate: { day: '', date: '' },
                currentTime_HM: '',
                currentTime_AP: '',
                currentDayCheck: null,
                
                init() {
                    const today = new Date();
                    const month = today.getMonth() + 1;
                    const day = today.getDate();
                    const year = today.getFullYear();
                    this.currentDate.day = today.toLocaleDateString('en-US', { weekday: 'short' });
                    this.currentDate.date = `${month} / ${day} / ${year}`;
                    this.currentDayCheck = day; // Initialize the day check

                    this.loadData();
                    this.applyBackground(this.selectedBackground, this.selectedBackgroundType);
                    
                    this.mainTick(); 
                    setInterval(() => this.mainTick(), 1000); 

                    // Run these once on load
                    this.getWeather();
                    this.getCalendarEvents(); // Get calendar on load
                    this.updateTimers(); 
                    
                    setInterval(() => this.updateTimers(), 5000); 
                },
                
                mainTick() {
                    const now = new Date();

                    let hours = now.getHours();
                    const minutes = now.getMinutes();
                    const ampm = hours >= 12 ? 'PM' : 'AM';
                    hours = hours % 12;
                    hours = hours ? hours : 12; 
                    this.currentTime_HM = `${hours}:${minutes < 10 ? '0' + minutes : minutes}`;
                    this.currentTime_AP = ampm;

                    const today = now.getDate();
                    if (today !== this.currentDayCheck) {
                        this.currentDayCheck = today; 

                        const month = now.getMonth() + 1;
                        const year = now.getFullYear();
                        this.currentDate.day = now.toLocaleDateString('en-US', { weekday: 'short' });
                        this.currentDate.date = `${month} / ${today} / ${year}`;

                        this.getWeather();
                        this.getCalendarEvents(); // Get new events at midnight
                    }
                },

                loadData() {
                    const savedEvents = localStorage.getItem('countdownEvents');
                    if (savedEvents) this.events = JSON.parse(savedEvents);
                    const savedBg = localStorage.getItem('countdownBg');
                    if (savedBg) {
                        const bgData = JSON.parse(savedBg);
                        this.selectedBackground = bgData.value;
                        this.selectedBackgroundType = bgData.type;
                    } else {
                        this.selectedBackground = 'var(--bg-color)';
                        this.selectedBackgroundType = 'color';
                    }
                    const savedLayout = localStorage.getItem('countdownLayout');
                    if (savedLayout) {
                        this.layoutMode = JSON.parse(savedLayout);
                    }
                },

                saveEvents() {
                    localStorage.setItem('countdownEvents', JSON.stringify(this.events));
                },

                applyBackground(value, type) {
                    document.body.style.backgroundImage = 'none';
                    document.body.style.backgroundColor = '';
                    document.body.style.backgroundSize = '';
                    if (type === 'color') {
                        document.body.style.backgroundColor = value;
                    } else if (type === 'gradient') {
                        document.body.style.backgroundImage = value;
                    } else if (type === 'pattern') {
                        document.body.style.backgroundImage = value.image;
                        document.body.style.backgroundSize = value.size;
                    } else if (type === 'image') {
                        document.body.style.backgroundImage = `url(${value})`;
                    } else {
                        document.body.style.backgroundColor = 'var(--bg-color)';
                    }
                },

                setBackground(value, type) {
                    this.selectedBackground = value;
                    this.selectedBackgroundType = type;
                    this.applyBackground(value, type);
                    localStorage.setItem('countdownBg', JSON.stringify({ value, type }));
                },
                
                setLayoutMode(mode) {
                    this.layoutMode = mode;
                    localStorage.setItem('countdownLayout', JSON.stringify(mode));
                },

                updateTimers() {
                    const now = new Date();
                    const localYear = now.getFullYear();
                    const localMonth = now.getMonth();
                    const localDay = now.getDate();
                    const nowMidnight = Date.UTC(localYear, localMonth, localDay);

                    this.events.forEach(event => {
                        const parts = event.date.split('-').map(Number);
                        const targetMidnight = Date.UTC(parts[0], parts[1] - 1, parts[2]);
                        const distance = targetMidnight - nowMidnight;
                        const days = Math.round(distance / (1000 * 60 * 60 * 24));

                        event.isPast = false;
                        event.isToday = false;
                        event.isTomorrow = false;
                        event.isYesterday = false;
                        event.days = 0;

                        if (days < 0) {
                            event.isPast = true;
                            event.days = Math.abs(days);
                            if (event.days === 1) {
                                event.isYesterday = true;
                            }
                        } else if (days === 0) {
                            event.isToday = true;
                        } else {
                            event.isPast = false;
                            event.days = days;
                            if (event.days === 1) {
                                event.isTomorrow = true;
                            }
                        }
                    });
                    this.events.sort((a, b) => new Date(a.date) - new Date(b.date));
                },

                openAddModal() {
                    this.editingEvent = null;
                    this.modalTitle = '';
                    this.modalDate = '';
                    this.showModal = true;
                },

                openEditModal(event) {
                    this.editingEvent = event;
                    this.modalTitle = event.title.replace(/ \p{Emoji}/u, ''); 
                    this.modalDate = event.date;
                    this.showModal = true;
                },

                closeModal() {
                    this.showModal = false;
                    this.editingEvent = null;
                    this.modalTitle = '';
                    this.modalDate = '';
                },

                saveEvent() {
                    if (!this.modalTitle || !this.modalDate) {
                        alert('Please fill in both the title and the date.');
                        return;
                    }
                    const processedTitle = this.processEventTitle(this.modalTitle);
                    if (this.editingEvent) {
                        this.editingEvent.title = processedTitle;
                        this.editingEvent.date = this.modalDate;
                    } else {
                        this.events.push({
                            id: Date.now(),
                            title: processedTitle,
                            date: this.modalDate,
                            days: 0,
                            isPast: false,
                            isToday: false
                        });
                    }
                    this.updateTimers();
                    this.saveEvents();
                    this.closeModal();
                },

                deleteEvent() {
                    if (!window.confirm('Are you sure you want to delete this event?')) {
                        return;
                    }
                    this.events = this.events.filter(event => event.id !== this.editingEvent.id);
                    this.saveEvents();
                    this.closeModal();
                },
                
                processEventTitle(title) {
                    let newTitle = title.trim();
                    const lowerCaseTitle = newTitle.toLowerCase();
                    const holidays = {
                        'new year': '🎉', 'valentine': '❤️', "st patrick": '☘️',
                        "st. patrick": '☘️', 'halloween': '🎃', 'thanksgiving': '🦃', 'christmas': '🎄',
                        'easter': '🐰'
                    };
                    const birthday = '🎂';
                    const birthdayKeywords = ['birthday', 'b-day', 'bday'];
                    const anniversary = '💖';
                    let emojiAdded = false;

                    if (birthdayKeywords.some(keyword => lowerCaseTitle.includes(keyword))) {
                        newTitle += ` ${birthday}`;
                        emojiAdded = true;
                    }
                    if (!emojiAdded && lowerCaseTitle.includes('anniversary')) {
                        newTitle += ` ${anniversary}`;
                        emojiAdded = true;
                    }
                    if (!emojiAdded) {
                        for (const [key, emoji] of Object.entries(holidays)) {
                            if (lowerCaseTitle.includes(key)) {
                                newTitle += ` ${emoji}`;
                                break; 
                            }
                        }
                    }
                    return newTitle;
                },

                getWeather() {
                    // 1. Get Grid Points for Southington, CT (Lat: 40.7128, Lon: -74.0060)
                    // We could hardcode the grid (BOX/63,83) but fetching is safer.
                    const lat = 40.7128;
                    const lon = -74.0060;
                    const userAgent = { 'User-Agent': '(my-weather-dashboard, contact@example.com)' };

                    fetch(`https://api.weather.gov/points/${lat},${lon}`, { headers: userAgent })
                        .then(res => res.json())
                        .then(data => {
                            const gridId = data.properties.gridId;
                            const gridX = data.properties.gridX;
                            const gridY = data.properties.gridY;

                            // 2. Fetch Daily Forecast AND Hourly Forecast in parallel
                            Promise.all([
                                fetch(`https://api.weather.gov/gridpoints/${gridId}/${gridX},${gridY}/forecast`, { headers: userAgent }).then(r => r.json()),
                                fetch(`https://api.weather.gov/gridpoints/${gridId}/${gridX},${gridY}/forecast/hourly`, { headers: userAgent }).then(r => r.json())
                            ]).then(([dailyData, hourlyData]) => {
                                this.processNWSData(dailyData, hourlyData);
                            });
                        })
                        .catch(error => console.error('Error fetching NWS weather:', error));
                },

                processNWSData(daily, hourly) {
                    const daysMap = {};
                    const today = new Date();
                    today.setHours(0,0,0,0);

                    // --- 1. Process Daily Summary (Highs/Lows/Icons) ---
                    daily.properties.periods.forEach(p => {
                        const date = new Date(p.startTime);
                        date.setHours(0,0,0,0);
                        const dateKey = date.toISOString();

                        if (!daysMap[dateKey]) {
                            daysMap[dateKey] = { 
                                date: date,
                                name: '', 
                                high: -999, 
                                low: 999, 
                                icon: p.icon, 
                                hourlyPrecip: [] 
                            };
                        }

                        // NWS logic: "isDaytime" true = High temp, false = Low temp
                        if (p.isDaytime) {
                            daysMap[dateKey].high = p.temperature;
                            daysMap[dateKey].icon = p.icon; // Prefer day icon
                        } else {
                            daysMap[dateKey].low = p.temperature;
                            // If we only have night data (e.g. looking late at night), use night icon
                            if (daysMap[dateKey].high === -999) daysMap[dateKey].icon = p.icon; 
                        }
                    });

                    // --- 2. Process Hourly Data (Precipitation) ---
                    hourly.properties.periods.forEach(p => {
                        const date = new Date(p.startTime);
                        const hour = date.getHours();
                        date.setHours(0,0,0,0);
                        const dateKey = date.toISOString();

                        if (daysMap[dateKey]) {
                            daysMap[dateKey].hourlyPrecip.push({
                                x: hour, // 0-23
                                y: p.probabilityOfPrecipitation.value || 0
                            });
                        }
                    });

                    // --- 3. Filter to Today, Tomorrow, Day After ---
                    const sortedKeys = Object.keys(daysMap).sort();
                    // Find the key that matches "today" to ensure we start there
                    const todayKey = today.toISOString();
                    const startIndex = sortedKeys.indexOf(todayKey);
                    
                    const finalDays = [];
                    if (startIndex > -1) {
                        // Take 3 days starting from today
                        for (let i = startIndex; i < startIndex + 3; i++) {
                            if (sortedKeys[i]) {
                                const d = daysMap[sortedKeys[i]];
                                // Set nice names
                                if (i === startIndex) d.name = "Today";
                                else if (i === startIndex + 1) d.name = "Tomorrow";
                                else d.name = d.date.toLocaleDateString('en-US', { weekday: 'long' });
                                
                                // Fallback if high temp is missing (e.g. it's night time already)
                                if (d.high === -999) d.high = d.low; 
                                
                                finalDays.push(d);
                            }
                        }
                    }

                    this.forecast = finalDays;

                    // --- 4. Render Charts (Wait for DOM to update) ---
                    this.$nextTick(() => {
                        this.renderCharts();
                    });
                },

                renderCharts() {
                    // Destroy old charts to prevent memory leaks
                    this.chartInstances.forEach(chart => chart.destroy());
                    this.chartInstances = [];

                    this.forecast.forEach((day, index) => {
                        const ctx = document.getElementById('chart-' + index);
                        if (!ctx) return;

                        // Prepare data labels (12AM, 3AM, etc or just numbers)
                        const labels = day.hourlyPrecip.map(p => {
                            // Simple hour formatting
                            let h = p.x;
                            let ampm = h >= 12 ? 'pm' : 'am';
                            h = h % 12;
                            h = h ? h : 12;
                            return h + ampm;
                        });
                        const dataPoints = day.hourlyPrecip.map(p => p.y);

                        const chart = new Chart(ctx, {
                            type: 'line',
                            data: {
                                labels: labels,
                                datasets: [{
                                    label: 'Rain %',
                                    data: dataPoints,
                                    borderColor: '#3b82f6', // Primary blue
                                    backgroundColor: 'rgba(59, 130, 246, 0.2)',
                                    borderWidth: 2,
                                    pointRadius: 0, // Clean line without dots
                                    fill: true,
                                    tension: 0.4 // Smooth curves
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: { legend: { display: false } }, // Hide legend
                                scales: {
                                    y: {
                                        min: 0, max: 100,
                                        display: false, // Hide Y axis labels for cleaner look
                                    },
                                    x: {
                                        grid: { display: false }, // Hide grid lines
                                        ticks: { 
                                            color: '#a0a0a0',
                                            font: { size: 10 },
                                            maxTicksLimit: 6 // Don't crowd the axis
                                        }
                                    }
                                }
                            }
                        });
                        this.chartInstances.push(chart);
                    });
                },

                // --- MODIFIED: Function now has a 10-second timeout for error handling ---
                getCalendarEvents() {
                    if (!this.calendarScriptUrl || this.calendarScriptUrl === 'PASTE_YOUR_APPS_SCRIPT_URL_HERE') {
                        console.error('Google Apps Script URL is missing.');
                        this.calendarLoading = false; // Set loading to false so "No events" shows
                        return;
                    }
                    
                    this.calendarLoading = true;
                    
                    // Set a timeout. If Google doesn't respond in 10s, show an error.
                    const errorTimeout = setTimeout(() => {
                        console.error('Google Calendar request timed out.');
                        this.calendarLoading = false; // Give up
                        delete window.handleCalendarData; // Clean up
                    }, 10000);

                    // 1. Define a global callback function that Alpine can access
                    window.handleCalendarData = (data) => {
                        clearTimeout(errorTimeout); // Success! Clear the timeout
                        this.calendarEvents = data;
                        this.calendarLoading = false;
                        
                        // Clean up: remove the script tag and the global function
                        document.body.removeChild(document.getElementById('jsonp-script'));
                        delete window.handleCalendarData;
                    };
    
                    // 2. Create a new script tag
                    const script = document.createElement('script');
                    script.id = 'jsonp-script';
                    
                    // 3. Set the URL with our callback function name
                    script.src = this.calendarScriptUrl + '?callback=handleCalendarData';
    
                    // 4. Add the script to the page to trigger the download
                    document.body.appendChild(script);
                },
